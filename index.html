<!DOCTYPE html>
<html ng-app="studentApp">
<head>
    <title>Student App</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="app.js"></script>
    <style>
        .pass { color: green; font-weight: bold; }
        .fail { color: red; font-weight: bold; }
    </style>
</head>
<body ng-controller="CollegeController">

    <h1>{{ collegeName }}</h1>

    <div ng-controller="StudentController">
        <!-- Form Inputs -->
        <input type="text" ng-model="name" placeholder="Name">
        <input type="text" ng-model="dept" placeholder="Dept">
        <input type="text" ng-model="sem" placeholder="Semester">
        <input type="number" ng-model="marks" placeholder="Marks">
        
        <br><br>
        <button ng-click="addStudent()">Add Student</button>
        <button ng-click="showDetails = !showDetails">Toggle Details</button>

        <!-- Show / Hide Details -->
        <div ng-show="showDetails">
            <p>Name: {{ name }} | Dept: {{ dept }} | Sem: {{ sem }}</p>
        </div>

        <!-- Result -->
        <p ng-if="marks != null" ng-class="{'pass': marks >= 40, 'fail': marks < 40}">
            Result: {{ marks >= 40 ? 'Pass' : 'Needs Improvement' }} ({{ marks }})
        </p>

        <!-- Student List -->
        <h3>Students:</h3>
        <ul>
            <li ng-repeat="s in students">{{ s }}</li>
        </ul>
    </div>

</body>
</html>
